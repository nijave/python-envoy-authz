[project]
name = "envoy-authz"
version = "0.1.0"
description = "Envoy External Authorization (ext_authz) gRPC service"
authors = [
    {name = "Nick Venenga",email = "nick@venenga.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio (>=1.76.0,<2.0.0)",
    "grpcio-tools (>=1.76.0,<2.0.0)",
    "envoyproxy-envoy-grpc-python (==1.83.0.1.20260715203741+d939ad7a9f30)",
    "pyopenssl (>=26.3.0,<26.4.0)",
    "python-json-logger (>=4.0.0,<5.0.0)",
    "grpcio-health-checking (>=1.80.0,<2.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "opentelemetry-sdk (>=1.44.0,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-grpc (>=1.44.0,<2.0.0)",
    "opentelemetry-instrumentation-grpc (>=0.65b0,<0.66)",
    "opentelemetry-instrumentation-fastapi (>=0.65b0,<0.66)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "authlib (>=1.7.2,<2.0.0)",
    "joserfc (>=1.7.4,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pyjwt (>=2.13.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "buf.build"
url = "https://buf.build/gen/python"
priority = "supplemental"


[dependency-groups]
dev = [
    "ruff (>=0.16.1,<0.17.0)",
    "pytest (>=8.3.0,<9.0.0)",
    "pytest-cov (>=6.0.0,<8.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "respx (>=0.23.1,<0.24.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: end-to-end tests against a live Vikunja stack (auto-skip if unreachable)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]
